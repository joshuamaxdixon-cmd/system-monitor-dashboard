<header class="site-header" aria-label="Primary navigation">
    <a class="brand-lockup" href="/#top" aria-label="Cloud With Josh home">
        <span class="brand-mark">JMD</span>
        <span class="brand-copy">
            <span>{{ site_name }}</span>
            <small>Cloud &amp; Systems Engineer</small>
        </span>
    </a>

    <nav class="top-nav">
        {% for link in nav_links %}
            <a href="{{ link.href }}"{% if link.target %} target="{{ link.target }}" rel="noopener noreferrer"{% endif %}>{{ link.label }}</a>
        {% endfor %}
    </nav>

    <a class="nav-cta" href="{{ github_profile }}" target="_blank" rel="noopener noreferrer">
        <span class="status-dot" aria-hidden="true"></span>
        View GitHub
    </a>
</header>
