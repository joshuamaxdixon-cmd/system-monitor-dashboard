<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23020713'/%3E%3Cpath d='M15 41V23h7v18c0 5-3 8-8 8-2 0-4-.4-6-1.3l1.8-5.4c1 .5 2 .7 3.1.7 1.4 0 2.1-.7 2.1-2zM27 47V17h7.2l7.8 12.8L49.8 17H57v30h-7V28.7l-7.5 12h-1.1L34 28.8V47h-7z' fill='%233b82f6'/%3E%3C/svg%3E">
    <script type="importmap">{"imports":{"three":"/static/js/three.module.min.js"}}</script>
    {{ base_styles | safe }}
</head>
<body id="top">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include "_portfolio_nav.html" %}
    <div class="container">
        <main id="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script>
        /* Reveal on scroll */
        (() => {
            const reveals = document.querySelectorAll('.reveal:not(.in)');
            if (!reveals.length) return;
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                reveals.forEach(r => r.classList.add('in'));
                return;
            }
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) { entry.target.classList.add('in'); observer.unobserve(entry.target); }
                });
            }, { threshold: 0.1 });
            reveals.forEach(r => observer.observe(r));
        })();

        /* Counter-up */
        (() => {
            const counters = document.querySelectorAll('[data-count]');
            if (!counters.length) return;
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                counters.forEach((el) => {
                    const target = parseFloat(el.dataset.count);
                    const suffix = el.dataset.suffix || '';
                    const isFloat = target % 1 !== 0;
                    el.textContent = (isFloat ? target.toFixed(2) : target) + suffix;
                });
                return;
            }
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    const el = entry.target;
                    const target = parseFloat(el.dataset.count);
                    const suffix = el.dataset.suffix || '';
                    const isFloat = target % 1 !== 0;
                    const duration = 1200;
                    const start = performance.now();
                    function tick(now) {
                        const eased = 1 - Math.pow(1 - Math.min((now - start) / duration, 1), 3);
                        const value = target * eased;
                        el.textContent = (isFloat ? value.toFixed(2) : Math.floor(value)) + suffix;
                        if (eased < 1) requestAnimationFrame(tick);
                        else el.textContent = (isFloat ? target.toFixed(2) : target) + suffix;
                    }
                    requestAnimationFrame(tick);
                    observer.unobserve(el);
                });
            }, { threshold: 0.4 });
            counters.forEach(c => observer.observe(c));
        })();

        /* Projects carousel */
        (() => {
            const scroll = document.getElementById('projectsScroll');
            const next = document.getElementById('carouselNext');
            if (!scroll || !next) return;
            next.addEventListener('click', () => {
                const cardWidth = (scroll.querySelector('.project-card')?.offsetWidth || 240) + 16;
                const maxScroll = scroll.scrollWidth - scroll.clientWidth;
                if (scroll.scrollLeft >= maxScroll - 5) scroll.scrollTo({ left: 0, behavior: 'smooth' });
                else scroll.scrollTo({ left: Math.min(scroll.scrollLeft + cardWidth * 2, maxScroll), behavior: 'smooth' });
            });
        })();

        /* Theme toggle (decorative) */
        (() => {
            const toggle = document.querySelector('.theme-toggle');
            if (!toggle) return;
            toggle.addEventListener('click', () => {
                toggle.style.transform = 'rotate(180deg)';
                setTimeout(() => { toggle.style.transform = ''; }, 300);
            });
        })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
