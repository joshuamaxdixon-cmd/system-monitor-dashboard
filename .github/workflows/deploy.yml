name: Deploy to EC2

on:
  push:
    branches:
      - main

env:
  PORTFOLIO_HOST: 3.143.207.232
  PORTFOLIO_APP_DIR: /home/ec2-user/system-monitor-dashboard
  PORTFOLIO_SERVICE: portfolio.service

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.PORTFOLIO_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
      script: |
          set -e
          cd ${{ env.PORTFOLIO_APP_DIR }}
          git fetch origin main
          git reset --hard origin/main
          sudo systemctl restart ${{ env.PORTFOLIO_SERVICE }}
          sudo systemctl is-active ${{ env.PORTFOLIO_SERVICE }}
          sudo systemctl status ${{ env.PORTFOLIO_SERVICE }} --no-pager -n 20
