name: Deploy to EC2

on:
  push:
    branches:
      - main

env:
  PORTFOLIO_HOST: "3.143.207.219"
  PORTFOLIO_APP_DIR: "/home/ec2-user/system-monitor-dashboard"
  PORTFOLIO_SERVICE: "portfolio.service"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.PORTFOLIO_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd "${{ env.PORTFOLIO_APP_DIR }}"
            git fetch origin main
            git reset --hard origin/main
            sudo systemctl restart "portfolio.service"

            for i in 1 2 3 4 5 6; do
              state=$(sudo systemctl is-active "portfolio.service" || true)
              echo "portfolio.service state: $state"
              if [ "$state" = "active" ]; then
                break
              fi
              sleep 2
            done

            sudo systemctl status "portfolio.service" --no-pager -n 20
            sudo systemctl is-active "portfolio.service"
